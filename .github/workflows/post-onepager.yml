name: Hindi one-pager

# Tue / Thu at 19:00 IST. GitHub reads cron as UTC and ignores the
# runner's timezone, so 19:00 IST is 13:30 UTC — not 19:00.
#
# Actions schedules drift by 5-15 minutes under load and can be dropped
# entirely at peak times. That is acceptable here: nothing downstream depends
# on the exact minute, and a missed slot costs one post.
on:
  schedule:
    - cron: "30 13 * * 2,4"
  workflow_dispatch:
    inputs:
      slug:
        description: "Post a specific blog slug instead of the next in rotation"
        type: string
        required: false
      dry_run:
        description: "Generate and commit the slides, but make no API call"
        type: boolean
        default: false

permissions:
  contents: write    # the bot commits rendered PNGs so raw URLs can serve them
  issues: write      # a failure opens an issue

# Two runs posting at once would double-post and race on the content commit.
concurrency:
  group: social-bot-content
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - run: npm ci || npm install

      - run: npx playwright install --with-deps chromium

      # Without this every Hindi glyph renders as a tofu box. The generator
      # asserts on glyph width and fails loudly rather than publishing them,
      # but installing the font is what actually prevents it.
      #
      # Noto Sans Devanagari lives in fonts-noto-core. There is no
      # "fonts-noto-devanagari" package — asking for one fails the whole
      # apt-get call, which is how run #1 died before rendering anything.
      # fonts-noto-color-emoji is separate and is what draws 💰 and 👇 in
      # colour rather than as outlines.
      - name: Install Devanagari fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji
          fc-cache -f
          # Prove the family is actually present before 300 seconds of
          # rendering depend on it.
          fc-list | grep -i "devanagari" | head -3
          fc-list | grep -qi "devanagari"

      - name: Post one-pager
        id: post
        env:
          SITE_URL:          https://www.jobs24india.com
          SOCIAL_FEED_TOKEN: ${{ secrets.SOCIAL_FEED_TOKEN }}
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          SYSTEM_USER_TOKEN: ${{ secrets.SYSTEM_USER_TOKEN }}
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID }}
          DRY_RUN:           ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node poster/post.js blog-onepager ${{ inputs.slug }}

      # The rotation has run out of articles. This is not a failure -- the run
      # succeeded and correctly posted nothing -- but every future run will do
      # the same, so the account goes quiet looking exactly like one that is
      # working. Worse, with no commits the repo falls idle and GitHub disables
      # scheduled workflows after 60 days, so adding translations later would
      # not restart it. One open issue, not one per run.
      - name: Flag an exhausted rotation
        if: steps.post.outputs.exhausted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const format = ${{ toJSON(steps.post.outputs.format) }} || 'carousel';
            const title = `content-exhausted: no ${format} left to post`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "content-exhausted",
            });
            if (existing.data.some(i => i.title === title)) {
              core.info("already flagged — not opening a duplicate");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["content-exhausted"],
              body: [
                `Every translated blog post has now been used as a **${format}**.`,
                ``,
                `From here every scheduled run posts nothing. That is correct behaviour,`,
                `but it is indistinguishable from a healthy account, which is why this`,
                `issue exists.`,
                ``,
                `Two things to know:`,
                ``,
                `1. The fix is more Hindi translations in the main repo`,
                `   (\`src/data/blog/translations/hi/\`), not more code here.`,
                `2. With nothing to commit this repo goes idle, and GitHub disables`,
                `   scheduled workflows after 60 days of inactivity. If that happens,`,
                `   re-enable the schedule from the Actions tab or the cron will not`,
                `   resume by itself.`,
                ``,
                `Close this once new translations are live.`,
              ].join("\n")
            });

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `posting-failure: one-pager (${new Date().toISOString().slice(0,10)})`,
              labels: ["posting-failure"],
              body: [
                `Workflow [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed.`,
                ``,
                `A silent cron is how four scheduled jobs went unnoticed for weeks on the main app.`,
                `If this is "nothing to post", the fix is more Hindi translations, not more code.`,
              ].join("\n")
            });

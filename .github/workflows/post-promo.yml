name: Promo post

# Wed 11:00 IST for employers (English), Sat 11:00 IST for seekers (Hindi).
# GitHub reads cron as UTC, so 11:00 IST is 05:30 UTC — not 11:00.
#
# One workflow, two schedules, because the audience is decided by which cron
# fired: `github.event.schedule` carries the expression verbatim, which is the
# only thing a scheduled run knows about why it started.
on:
  schedule:
    - cron: "30 5 * * 3"   # Wednesday  -> employer, English
    - cron: "30 5 * * 6"   # Saturday   -> seeker, Hindi
  workflow_dispatch:
    inputs:
      audience:
        description: "Which audience to post for"
        type: choice
        options: [employer, seeker]
        default: employer
      dry_run:
        description: "Generate and commit the card, but make no API call"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: social-bot-content
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - run: npm ci || npm install

      - run: npx playwright install --with-deps chromium

      # The Hindi promos need this as much as the blog cards do; the generator
      # asserts on glyph width for any card whose lang is "hi".
      - name: Install Devanagari fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji
          fc-cache -f
          fc-list | grep -qi "devanagari"

      # A manual run takes the audience from the dropdown; a scheduled one
      # takes it from which cron fired.
      - name: Decide the audience
        id: who
        run: |
          if [ -n "${{ inputs.audience }}" ]; then
            echo "audience=${{ inputs.audience }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5 * * 6" ]; then
            echo "audience=seeker" >> "$GITHUB_OUTPUT"
          else
            echo "audience=employer" >> "$GITHUB_OUTPUT"
          fi

      - name: Post promo
        id: post
        env:
          # No SOCIAL_FEED_TOKEN and no SITE_URL: promos come from the local
          # bank, so this slot still posts on a day the app is unreachable.
          PROMO_AUDIENCE:    ${{ steps.who.outputs.audience }}
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          SYSTEM_USER_TOKEN: ${{ secrets.SYSTEM_USER_TOKEN }}
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID }}
          DRY_RUN:           ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node poster/post.js promo

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `posting-failure: promo (${new Date().toISOString().slice(0,10)})`,
              labels: ["posting-failure"],
              body: `Workflow [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed.`
            });
